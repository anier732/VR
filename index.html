<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VR Interactive Experience</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: sans-serif; }
        #menu { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); color: #fff; padding: 10px; border-radius: 8px; display: none; }
        #toggle-btn { position: absolute; top: 10px; left: 10px; z-index: 1001; }
        #gauge-container { position: absolute; top: 10%; right: 20px; width: 30px; height: 70%; background: #333; border: 2px solid #fff; }
        #gauge-fill { width: 100%; height: 0%; background: #ff00ff; }
        #dialogue { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 24px; text-shadow: 2px 2px #000; }
    </style>
</head>
<body>
    <button id="toggle-btn">Menu</button>
    <div id="menu">
        <ul style="list-style: none; padding: 0;">
            <li id="btn-solo" style="cursor:pointer; margin-bottom:10px;">一人で…</li>
            <li id="btn-toy" style="cursor:pointer; margin-bottom:10px;">道具を使う</li>
            <li id="btn-couple" style="cursor:pointer;">一緒に…</li>
        </ul>
    </div>
    <div id="gauge-container"><div id="gauge-fill"></div></div>
    <div id="dialogue"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { VRM, VRMUtils } from '@pixiv/three-vrm';

    const scene = new THREE.Scene();
    const light = new THREE.DirectionalLight(0xffffff, 2.0);
    light.position.set(0, 2, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 1.0));

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 1.5); // カメラ位置を調整
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const scripts = {
        SOLO: ["…あ、見ないで…", "一人だと、変な感じ…", "んっ…！"],
        TOY: ["…これ、中まで…っ！", "あぁ…っ、壊れそう…", "気持ちいい…っ！"],
        COUPLE: ["…好き…もっと激しくして…", "あぁっ！いっちゃう！", "全部…中で出して…"]
    };

    let mode = "SOLO", intensity = 0, isClimax = false;
    const fill = document.getElementById('gauge-fill');
    const dialogue = document.getElementById('dialogue');

    document.getElementById('toggle-btn').onclick = () => {
        const m = document.getElementById('menu');
        m.style.display = m.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('btn-solo').onclick = () => { mode = "SOLO"; intensity = 0; };
    document.getElementById('btn-toy').onclick = () => { mode = "TOY"; intensity = 0; };
    document.getElementById('btn-couple').onclick = () => { mode = "COUPLE"; intensity = 0; };

    const loader = new GLTFLoader();
    // ここを model.glb に修正しました
    loader.load('model.glb', (gltf) => {
        VRM.from(gltf).then((vrm) => {
            scene.add(vrm.scene);
            vrm.scene.position.set(0, 0, 0); 
            
            renderer.setAnimationLoop((time) => {
                if (!isClimax) intensity += 0.05;
                fill.style.height = Math.min(intensity, 100) + "%";

                if (intensity > 100 && !isClimax) {
                    isClimax = true;
                    dialogue.innerText = "あ゛ぁっ！！潮吹いちゃった…！";
                    document.body.style.backgroundColor = "#ff99cc";
                } else if (!isClimax && Math.random() < 0.01) {
                    const list = scripts[mode];
                    dialogue.innerText = list[Math.floor(Math.random() * list.length)];
                }

                const hips = vrm.humanoid.getBoneNode('hips');
                if (hips) hips.rotation.x = Math.sin(time * 0.005 * (isClimax ? 20 : (mode === "SOLO" ? 3 : 8))) * 0.3;
                vrm.update(0.016);
                renderer.render(scene, camera);
            });
        });
    }, undefined, (err) => {
        console.error("モデル読み込みエラー:", err);
    });
</script>
</body>
</html>
