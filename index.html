<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VR Interactive Experience</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #dialogue { 
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            color: #ff00ff; font-size: 32px; background: rgba(0,0,0,0.8);
            padding: 30px; border: 2px solid #ff00ff; display: none; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="dialogue"></div>
<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { VRM } from '@pixiv/three-vrm';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 50);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const dialogueEl = document.getElementById('dialogue');
    
    // シチュエーションとセリフのデータ
    const data = {
        SOLO: ["…あ、見ないで…", "一人だと、変な感じ…", "んっ…！"],
        TOY: ["…これ、中まで…っ！", "あぁ…っ、壊れそう…", "気持ちいい…っ！"],
        COUPLE: ["…好き…もっと激しくして…", "あぁっ！いっちゃう！", "全部…中で出して…"]
    };

    let mode = "SOLO";
    let intensity = 0; // 時間経過で上がるゲージ
    let isClimax = false;

    const loader = new GLTFLoader();
    let currentVrm = null;

    loader.load('2404886420955899236.vrm.glb', (gltf) => {
        VRM.from(gltf).then((vrm) => {
            currentVrm = vrm;
            vrm.scene.position.set(0, 0.7, -1.2);
            scene.add(vrm.scene);
        });
    });

    // モード切替：クリックでモード変更
    window.addEventListener('mousedown', () => {
        const modes = ["SOLO", "TOY", "COUPLE"];
        mode = modes[(modes.indexOf(mode) + 1) % 3];
        intensity = 0; // リセット
        isClimax = false;
    });

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        if (currentVrm) {
            intensity += 0.005; // 時間経過で強まる
            
            // クライマックス演出
            if (intensity > 5 && !isClimax) {
                isClimax = true;
                dialogueEl.style.display = 'block';
                dialogueEl.innerText = "あ゛ぁっ！！！！！";
                // ここでパーティクル(潮吹き表現)を表示するコードなどを追加可能
            }

            // モードに応じた動きの変化
            const speed = isClimax ? 10 : 3;
            const amp = isClimax ? 0.4 : 0.2;
            const hips = currentVrm.humanoid.getBoneNode('hips');
            if (hips) hips.rotation.x = Math.sin(time * speed) * amp;

            currentVrm.update(0.016);
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
