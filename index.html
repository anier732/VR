<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Girl Perfect Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-super-hands-component@master/dist/aframe-super-hands.min.js"></script>
    
    <script>
      AFRAME.registerComponent('ball-game', {
        init: function () {
          var girl = document.querySelector('#girl');
          var text = document.querySelector('#speech-text');
          
          this.el.addEventListener('collidestart', function () {
            text.setAttribute('value', 'Kyaaa! Nice catch!');
            girl.setAttribute('color', '#FFC0CB'); // 当たると女の子がピンクに照れる
            
            setTimeout(function() {
              text.setAttribute('value', 'Throw the ball to me!');
              girl.setAttribute('color', '#FFFFFF'); // 元に戻る
            }, 3000);
          });
        }
      });
    </script>
  </head>
  
  <body>
    <a-scene movement-controls="controls: checkpoint, gamepad, trackpad, keyboard, touch; speed: 0.1">
      
      <a-sky color="#FFF0F5"></a-sky> 
      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#F5DEB3"></a-plane>

      <a-image id="girl" 
               src="https://cdn.phototourl.com/free/2026-06-02-c50c9f28-478e-44fd-914c-0c4c82dc15fe.jpg" 
               position="0 1.3 -3" 
               width="1.2" 
               height="1.8"
               sphere-collider="objects: #ball"></a-image>

      <a-text id="speech-text" value="Throw the ball to me!" 
              position="0 2.4 -3" align="center" color="#FF1493" width="5"></a-text>

      <a-sphere id="ball" position="0 1.2 -1" radius="0.15" color="#FF69B4"
                hoverable grabbable stretchable droppable ball-game></a-sphere>

      <a-entity id="rig" movement-controls>
        <a-entity camera position="0 1.6 0" look-controls></a-entity>
        <a-entity id="left-hand" sphere-collider="objects: #ball" super-hands oculus-touch-controls="hand: left"></a-entity>
        <a-entity id="right-hand" sphere-collider="objects: #ball" super-hands oculus-touch-controls="hand: right"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
