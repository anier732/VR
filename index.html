<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quest 3S対応 VRイチャイチャゲーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #subtitles {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #fff; font-size: 26px; font-weight: bold;
            text-shadow: 3px 3px 6px #000, -3px -3px 6px #000; pointer-events: none; z-index: 10;
        }
        #vr-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: #ff69b4; color: white; font-size: 20px;
            font-weight: bold; border: none; border-radius: 10px; cursor: pointer; z-index: 999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: none;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 22px; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">女の子をルームに呼んでいます...</div>
    <div id="subtitles">（Quest 3Sのブラウザで開いて、下のボタンを押してね）</div>
    <button id="vr-button">VRモードを起動する</button>

    <script>
        // --- 1. 3D空間の基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff5f5); // ピンクホワイトの部屋

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const userGroup = new THREE.Group();
        userGroup.add(camera);
        scene.add(userGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.xr.enabled = true; // VRモードを有効化
        document.body.appendChild(renderer.domElement);

        // 明るいライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(2, 5, 3);
        scene.add(dirLight);

        // 床のグリッド
        const gridHelper = new THREE.GridHelper(10, 10, 0xff69b4, 0xcccccc);
        scene.add(gridHelper);

        // --- 2. あなたのVRoidデータを100%確実に読み込む設定 ---
        let girlModel = null;
        let girlHeadBone = null;
        const loader = new THREE.GLTFLoader();

        // 外部サーバーではなく、あなたのGitHubに置いてあるその長い数字のファイルを直接指定します
        const modelUrl = '8535350609400951985.vrm.glb';

        loader.load(modelUrl, function (gltf) {
            girlModel = gltf.scene;
            scene.add(girlModel);

            // 目の前1メートル先に配置
            girlModel.position.set(0, 0, -1.0);
            girlModel.rotation.y = Math.PI; // あなたの方を正面にむかせる

            // VRoidの頭ボーンを探索
            girlModel.traverse((child) => {
                if (child.isBone && (child.name.toLowerCase().includes('head') || child.name.includes('J_Bnd_C_Head'))) {
                    girlHeadBone = child;
                }
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('subtitles').innerText = "女の子：『お待たせ！やっと会えたねっ♪』";
            
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
                    if (supported) {
                        const btn = document.getElementById('vr-button');
                        btn.style.display = 'block';
                        btn.addEventListener('click', onVRButtonClick);
                    }
                });
            }
        }, null, function (err) {
            console.error(err);
            document.getElementById('loading').style.color = "red";
            document.getElementById('loading').innerText = "データの読み込みエラー。ファイル名が一致しているか確認してください。";
        });

        // --- 3. Questコントローラー設定 ---
        const controller1 = renderer.xr.getController(0);
        scene.add(controller1);
        const controller2 = renderer.xr.getController(1);
        scene.add(controller2);

        // --- 4. VRモードの開始・終了 ---
        let xrSession = null;
        function onVRButtonClick() {
            if (xrSession === null) {
                navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then(function (session) {
                    renderer.xr.setSession(session);
                    document.getElementById('vr-button').textContent = 'VRを終了する';
                    xrSession = session;
                });
            } else {
                xrSession.end();
                document.getElementById('vr-button').textContent = 'VRモードを起動する';
                xrSession = null;
            }
        }

        // --- 5. メインループ（目線追従・距離判定・なでなで） ---
        renderer.setAnimationLoop(function () {
            const headsetPos = new THREE.Vector3();
            camera.getWorldPosition(headsetPos);

            if (girlModel) {
                // 【目線追従】
                if (girlHeadBone) { 
                    girlHeadBone.lookAt(headsetPos); 
                }

                // 【距離判定】
                const dist = headsetPos.distanceTo(girlModel.position);
                const subtitles = document.getElementById('subtitles');
                
                if (dist < 0.4) {
                    subtitles.innerText = "女の子：『ちょっと、急に近すぎるよぉ……///』";
                } else if (dist < 0.8) {
                    subtitles.innerText = "女の子：『えへへ、近くにいてくれるの嬉しいな』";
                }

                // 【なでなで判定】
                const girlHeadPos = new THREE.Vector3(girlModel.position.x, 1.35, girlModel.position.z);
                const c1Pos = new THREE.Vector3();
                const c2Pos = new THREE.Vector3();
                controller1.getWorldPosition(c1Pos);
                controller2.getWorldPosition(c2Pos);

                if (c1Pos.distanceTo(girlHeadPos) < 0.2 || c2Pos.distanceTo(girlHeadPos) < 0.2) {
                    subtitles.innerText = "女の子：『んぅ…あたま, なでなでするの気持ちいい……♪』";
                    if (xrSession) {
                        for (const inputSource of xrSession.inputSources) {
                            if (inputSource.gamepad && inputSource.gamepad.hapticActuators && inputSource.gamepad.hapticActuators[0]) {
                                inputSource.gamepad.hapticActuators[0].pulse(0.12, 50);
                            }
                        }
                    }
                }
                girlModel.position.y = Math.sin(Date.now() * 0.002) * 0.005;
            }
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
