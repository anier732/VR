<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quest 3S対応 VRマイルーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #subtitles {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #fff; font-size: 26px; font-weight: bold;
            text-shadow: 3px 3px 6px #000, -3px -3px 6px #000; pointer-events: none; z-index: 10;
        }
        #vr-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: #ff69b4; color: white; font-size: 20px;
            font-weight: bold; border: none; border-radius: 10px; cursor: pointer; z-index: 999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: none;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 22px; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">お部屋と女の子を準備中...</div>
    <div id="subtitles">（Quest 3Sのブラウザで開いて、下のボタンを押してね）</div>
    <button id="vr-button">VRモードを起動する</button>

    <script>
        // --- 1. 3D空間の設定（リアルなお部屋を即席で作る） ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5ebe0); // 温かみのある壁の色

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const userGroup = new THREE.Group();
        userGroup.add(camera);
        scene.add(userGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.xr.enabled = true; // VRモード有効
        document.body.appendChild(renderer.domElement);

        // お部屋用の明るいライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const roomLight = new THREE.PointLight(0xfff0dd, 0.8, 10); // 部屋の照明風ライト
        roomLight.position.set(0, 2.5, 0);
        scene.add(roomLight);

        // 【部屋の作成】プログラムで簡易的な「マイルーム」の壁と床を作ります
        const roomGroup = new THREE.Group();
        
        // フローリングの床
        const floorGeo = new THREE.PlaneGeometry(6, 6);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.4 }); // 木目調ブラウン
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        roomGroup.add(floor);

        // 奥の壁
        const wallGeo = new THREE.PlaneGeometry(6, 3);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfaedcd }); // クリーム色の壁
        const backWall = new THREE.Mesh(wallGeo, wallMat);
        backWall.position.set(0, 1.5, -3);
        roomGroup.add(backWall);

        // 左右の壁
        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.position.set(-3, 1.5, 0);
        leftWall.rotation.y = Math.PI / 2;
        roomGroup.add(leftWall);

        const rightWall = new THREE.Mesh(wallGeo, wallMat);
        rightWall.position.set(3, 1.5, 0);
        rightWall.rotation.y = -Math.PI / 2;
        roomGroup.add(rightWall);

        scene.add(roomGroup);

        // --- 2. 女の子のロードとアニメーション設定 ---
        let girlModel = null;
        let girlHeadBone = null;
        let mixer = null; // アニメーションを動かすためのコントローラー
        const clock = new THREE.Clock(); // 時間の経過を測る時計
        const loader = new THREE.GLTFLoader();

        const modelUrl = '8535350609400951985.vrm.glb';

        loader.load(modelUrl, function (gltf) {
            girlModel = gltf.scene;
            scene.add(girlModel);

            // 部屋の中心（あなたの1.2メートル先）に配置
            girlModel.position.set(0, 0, -1.2);
            girlModel.rotation.y = Math.PI; // 正面を向かせる

            // 【新機能】モデルに入っている「動き（アニメーション）」を再生する
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(girlModel);
                // 1番最初に入っているアニメーション（通常は待機ポーズや足振り）を再生
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
            }

            // 頭のボーンを探索（目線追従用）
            girlModel.traverse((child) => {
                if (child.isBone && (child.name.toLowerCase().includes('head') || child.name.includes('J_Bnd_C_Head'))) {
                    girlHeadBone = child;
                }
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('subtitles').innerText = "女の子：『私の部屋へようこそ！ゆっくりしていってね♪』";
            
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
                    if (supported) {
                        const btn = document.getElementById('vr-button');
                        btn.style.display = 'block';
                        btn.addEventListener('click', onVRButtonClick);
                    }
                });
            }
        }, null, function (err) {
            document.getElementById('loading').style.color = "red";
            document.getElementById('loading').innerText = "データ読み込みエラー。ファイル名を確認してください。";
        });

        // --- 3. Questコントローラー設定 ---
        const controller1 = renderer.xr.getController(0);
        scene.add(controller1);
        const controller2 = renderer.xr.getController(1);
        scene.add(controller2);

        // --- 4. VRモードの開始・終了 ---
        let xrSession = null;
        function onVRButtonClick() {
            if (xrSession === null) {
                navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then(function (session) {
                    renderer.xr.setSession(session);
                    document.getElementById('vr-button').textContent = 'VRを終了する';
                    xrSession = session;
                });
            } else {
                xrSession.end();
                document.getElementById('vr-button').textContent = 'VRモードを起動する';
                xrSession = null;
            }
        }

        // --- 5. メインループ（毎フレーム実行） ---
        renderer.setAnimationLoop(function () {
            const delta = clock.getDelta();

            // 【重要】女の子のアニメーションを1コマ進める
            if (mixer) {
                mixer.update(delta);
            }

            const headsetPos = new THREE.Vector3();
            camera.getWorldPosition(headsetPos);

            if (girlModel) {
                // 目線追従
                if (girlHeadBone) { 
                    girlHeadBone.lookAt(headsetPos); 
                }

                // 距離判定
                const dist = headsetPos.distanceTo(girlModel.position);
                const subtitles = document.getElementById('subtitles');
                
                if (dist < 0.4) {
                    subtitles.innerText = "女の子：『うわっ、急に顔近づけるからびっくりした……///』";
                } else if (dist < 0.8) {
                    subtitles.innerText = "女の子：『ふふ、私の部屋、どうかな？落ち着くでしょ？』";
                }

                // なでなで判定（頭の高さ約1.35m）
                const girlHeadPos = new THREE.Vector3(girlModel.position.x, 1.35, girlModel.position.z);
                const c1Pos = new THREE.Vector3();
                const c2Pos = new THREE.Vector3();
                controller1.getWorldPosition(c1Pos);
                controller2.getWorldPosition(c2Pos);

                if (c1Pos.distanceTo(girlHeadPos) < 0.2 || c2Pos.distanceTo(girlHeadPos) < 0.2) {
                    subtitles.innerText = "女の子：『あはは、なでなでするの手が優しいね……あったかい…♪』";
                    if (xrSession) {
                        for (const inputSource of xrSession.inputSources) {
                            if (inputSource.gamepad && inputSource.gamepad.hapticActuators && inputSource.gamepad.hapticActuators[0]) {
                                inputSource.gamepad.hapticActuators[0].pulse(0.1, 40); // ほんのりぶるぶる
                            }
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
