<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Girl & Walking Game</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene movement-controls="controls: checkpoint, gamepad, trackpad, keyboard, touch; speed: 0.1">
      
      <a-sky color="#87CEEB"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#7CFC00"></a-plane>

      <a-image id="girl-image" 
               src="https://cdn.phototourl.com/free/2026-06-02-48a18d94-faa5-4995-8e33-33ae4dd96ccc.jpg" 
               position="0 1.3 -3" 
               width="1.2" 
               height="1.8">
      </a-image>

      <a-text value="Hello! Come here!" position="0 2.4 -3" align="center" color="#000000" width="4"></a-text>

      <a-entity id="rig" movement-controls>
        <a-entity camera position="0 1.6 0" look-controls></a-entity>
        
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
