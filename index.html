<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Surveillance System</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #overlay { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 20px; border: 1px solid #0f0; width: 300px; }
        canvas { display: block; }
        #msg { color: #f0f; font-weight: bold; margin-top: 10px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
            }
        }
    </script>
</head>
<body>

<div id="overlay">
    <h2>Access Terminal</h2>
    <input type="password" id="pw" placeholder="PASSWORD">
    <button onclick="check()">LOGIN</button>
    <p id="msg"></p>
</div>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { VRM, VRMUtils } from '@pixiv/three-vrm';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.2, 2.5); // 少し近づける
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 1, 1);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const loader = new GLTFLoader();
    let currentVrm = null;
    let isHackingSuccess = false;

    loader.load('2404886420955899236.vrm.glb', (gltf) => {
        VRMUtils.removeUnnecessaryJoints(gltf.scene);
        VRM.from(gltf).then((vrm) => {
            scene.add(vrm.scene);
            currentVrm = vrm;
        });
    });

    const lines = ["誰にも見られてないから…安心ね。", "あ…ん、こんなことしたらダメなのに…", "気持ちいい…ずっとこうしていたい…", "んっ…！誰か見てるかも…"];

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        if (isHackingSuccess && currentVrm) {
            // 腰を動かす（hな動作の再現）
            const hips = currentVrm.humanoid.getBoneNode('hips');
            if (hips) hips.rotation.x = Math.sin(time * 3) * 0.2;

            // 定期的なセリフ表示
            if (Math.floor(time) % 8 === 0 && Math.random() < 0.02) {
                document.getElementById('msg').innerText = "NOA: " + lines[Math.floor(Math.random() * lines.length)];
            }
            currentVrm.update(0.016);
        }
        renderer.render(scene, camera);
    }
    animate();

    window.check = () => {
        const p = document.getElementById('pw').value;
        if(p === "noa0721") {
            isHackingSuccess = true;
            document.getElementById('msg').innerText = "System Hacked. Live Feed Active.";
        } else {
            alert("Access Denied");
        }
    }
</script>
</body>
</html>
