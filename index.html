<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Girl Game</title>
    <!-- A-Frameライブラリ -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- コントローラーで物を掴むためのライブラリ -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-super-hands-component@master/dist/aframe-super-hands.min.js"></script>
    
    <!-- ギミック用のJavaScript -->
    <script>
      AFRAME.registerComponent('ball-game', {
        init: function () {
          var girl = document.querySelector('#girl');
          var text = document.querySelector('#speech-text');
          
          // ボールが女の子（パネル）にぶつかった時の処理
          this.el.addEventListener('collidestart', function (evt) {
            // 女の子のセリフを変える
            text.setAttribute('value', 'Kyaaa! Nice catch!');
            // 女の子の画像を変更（笑顔のフリー素材画像など。今回は色を少し変えて反応を表現）
            girl.setAttribute('color', '#FFC0CB'); 
            
            // 3秒後に元のセリフに戻す
            setTimeout(function() {
              text.setAttribute('value', 'Throw the ball to me!');
              girl.setAttribute('color', '#FFFFFF');
            }, 3000);
          });
        }
      });
    </script>
  </head>
  
  <body>
    <a-scene>
      <!-- 背景と地面 -->
      <a-sky color="#FFF0F5"></a-sky> <!-- 薄いピンクの空 -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#F5DEB3"></a-plane>

      <!-- 1. 女の子（パネルとして配置） -->
      <!-- srcのURL部分を、将来的に自分の好きな女の子のイラストURLに変えることも可能です -->
      <a-image id="girl" src="https://picsum.photos/id/1025/400/600" 
               position="0 2 -3" width="1.5" height="2.2"
               sphere-collider="objects: #ball"></a-image>

      <!-- 女の子のセリフ（頭上に表示） -->
      <a-text id="speech-text" value="Throw the ball to me!" 
              position="0 3.5 -3" align="center" color="#FF1493" width="5"></a-text>

      <!-- 2. 女の子に投げるためのボール -->
      <!-- ball-game コンポーネントでぶつかった判定を取ります -->
      <a-sphere id="ball" position="0 1.2 -1" radius="0.15" color="#FF69B4"
                hoverable grabbable stretchable droppable ball-game></a-sphere>

      <!-- 3. Quest 3S のコントローラー設定 -->
      <a-entity id="left-hand" sphere-collider="objects: #ball" super-hands
                oculus-touch-controls="hand: left"></a-entity>
                
      <a-entity id="right-hand" sphere-collider="objects: #ball" super-hands
                oculus-touch-controls="hand: right"></a-entity>
    </a-scene>
  </body>
</html>
