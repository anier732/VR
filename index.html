<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VR Surveillance System</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 10%; left: 10%; color: #0f0; z-index: 100; pointer-events: none; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>ACCESS TERMINAL</h1>
        <p>Click (Trigger) to initiate connection.</p>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { VRM, VRMUtils } from '@pixiv/three-vrm';

    // シーン設定
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 50);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // 照明
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 2, 1);
    scene.add(light);

    // 部屋と机（VR環境用）
    const desk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 0.6), new THREE.MeshBasicMaterial({color: 0x332211}));
    desk.position.set(0, 0.35, -0.8);
    scene.add(desk);

    // モデル読み込み
    const loader = new GLTFLoader();
    let currentVrm = null;
    let active = false;

    loader.load('2404886420955899236.vrm.glb', (gltf) => {
        VRMUtils.removeUnnecessaryJoints(gltf.scene);
        VRM.from(gltf).then((vrm) => {
            currentVrm = vrm;
            vrm.scene.position.set(0, 0.7, -1.2); // 机の向こう側
            scene.add(vrm.scene);
        });
    });

    // 起動トリガー
    window.addEventListener('mousedown', () => { active = true; document.getElementById('ui').style.display = 'none'; });

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        if (active && currentVrm) {
            const hips = currentVrm.humanoid.getBoneNode('hips');
            if (hips) {
                // 腰の動き
                hips.rotation.x = Math.sin(time * 3) * 0.15;
            }
            currentVrm.update(0.016);
        }
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
