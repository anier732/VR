<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Debug VR Mode</title>
    <style>
        body { margin: 0; background: #333; color: #fff; font-family: sans-serif; }
        #debug { position: absolute; top: 20px; left: 20px; z-index: 1000; font-size: 20px; }
    </style>
</head>
<body>
    <div id="debug">Initializing...</div>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { VRButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/VRButton.js';
    import { VRM, VRMUtils } from 'https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js';

    const debugEl = document.getElementById('debug');
    const scene = new THREE.Scene();
    // 確実に明るくする
    scene.add(new THREE.AmbientLight(0xffffff, 5.0)); 
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    debugEl.innerText = "Loading model...";

    const loader = new GLTFLoader();
    loader.load('2404886420955899236.vrm.glb', (gltf) => {
        debugEl.innerText = "Model loaded successfully!";
        VRM.from(gltf).then((vrm) => {
            vrm.scene.position.set(0, 0, -2); // 目の前に固定
            scene.add(vrm.scene);
            window.vrm = vrm;
        });
    }, undefined, (error) => {
        debugEl.innerText = "Error: Model file not found. Check filename!";
        console.error(error);
    });

    renderer.setAnimationLoop((time) => {
        if (window.vrm) window.vrm.update(0.016);
        renderer.render(scene, camera);
    });
</script>
</body>
</html>
