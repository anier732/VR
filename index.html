<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quest 3S & スマホ対応 究極18禁ルーム 修正版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; touch-action: none; }
        
        /* 起動時のモード選択画面 */
        #mode-selection {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #151515, #2a2a2a); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .mode-title { font-size: 26px; font-weight: bold; color: #ff69b4; margin-bottom: 30px; text-shadow: 0 0 10px rgba(255,105,180,0.6); text-align: center; }
        .mode-btn {
            width: 280px; padding: 16px; margin: 12px; border: none; border-radius: 12px;
            font-size: 18px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        #btn-vr { background: #ff1493; }
        #btn-phone { background: #00bfff; }
        .mode-btn:active { transform: scale(0.95); }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 22px; z-index: 9999; display: none; pointer-events: none;
        }

        /* スマホ用操作UI */
        #phone-ui { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; pointer-events: none; z-index: 500; }
        
        /* 右上の表示/非表示ボタン */
        #toggle-ui-btn {
            position: absolute; top: 15px; right: 15px; padding: 10px 20px;
            background: rgba(0,0,0,0.75); color: #fff; border: 2px solid #ff69b4;
            border-radius: 8px; font-size: 15px; font-weight: bold; pointer-events: auto; cursor: pointer;
        }

        /* 左下のバーチャル移動スティック */
        #joystick-container {
            position: absolute; bottom: 25px; left: 35px; width: 110px; height: 110px;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center;
        }
        #joystick-knob {
            width: 45px; height: 45px; background: rgba(255, 20, 147, 0.85); border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,20,147,0.5);
        }

        /* 右下の発射ボタン */
        #shoot-btn {
            position: absolute; bottom: 25px; right: 35px; width: 95px; height: 95px;
            background: linear-gradient(135deg, #ff1493, #ff69b4); border: 3px solid #fff;
            border-radius: 50%; color: white; font-size: 20px; font-weight: bold;
            display: flex; justify-content: center; align-items: center; pointer-events: auto;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        #shoot-btn:active { transform: scale(0.9); background: #ff007f; }
    </style>
</head>
<body>

    <div id="mode-selection">
        <div class="mode-title">究極奉仕ルーム<br>物理タップ＆全裸バグ修正版</div>
        <button id="btn-vr" class="mode-btn">VRモードで開始 (Quest等)</button>
        <button id="btn-phone" class="mode-btn">スマホモードで開始 (横画面)</button>
    </div>

    <div id="loading">美女モデルおよび空間を生成中...</div>

    <div id="phone-ui">
        <button id="toggle-ui-btn">UI非表示</button>
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
        <div id="shoot-btn">発射</div>
    </div>

    <script>
        let isVRMode = false;
        let uiVisible = true;

        // モードセレクト処理
        document.getElementById('btn-vr').addEventListener('click', () => {
            isVRMode = true;
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            initSystem();
            onVRStart();
        });

        document.getElementById('btn-phone').addEventListener('click', () => {
            isVRMode = false;
            document.getElementById('mode-selection').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('phone-ui').style.display = 'block';
            initSystem();
        });

        // UI表示切り替え
        const toggleUiBtn = document.getElementById('toggle-ui-btn');
        toggleUiBtn.addEventListener('click', () => {
            uiVisible = !uiVisible;
            if (uiVisible) {
                toggleUiBtn.innerText = "UI非表示";
                document.getElementById('joystick-container').style.display = 'flex';
                document.getElementById('shoot-btn').style.display = 'flex';
                panelGroup.visible = true;
            } else {
                toggleUiBtn.innerText = "UI表示";
                document.getElementById('joystick-container').style.display = 'none';
                document.getElementById('shoot-btn').style.display = 'none';
                panelGroup.visible = false;
            }
        });

        // --- 1. 3Dシーン・カメラ初期位置設定（埋まりバグを完全回避） ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff0f5); 

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const userGroup = new THREE.Group();
        // プレイヤーの初期立ち位置をベッドの少し手前、かつ高さを1.1mに設定して埋まりを絶対阻止
        userGroup.position.set(0, 1.1, 0.4); 
        userGroup.add(camera);
        scene.add(userGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // ライティング
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.9);
        scene.add(ambientLight);
        const roomLight = new THREE.PointLight(0xffd700, 0.6, 12);
        roomLight.position.set(0, 3, 0);
        scene.add(roomLight);

        // ラブベッド配置
        const bedGroup = new THREE.Group();
        const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 2.2), new THREE.MeshStandardMaterial({ color: 0x4a2e2b }));
        bedFrame.position.set(0, 0.2, 0);
        bedGroup.add(bedFrame);
        const mattress = new THREE.Mesh(new THREE.BoxGeometry(1.54, 0.25, 2.14), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 }));
        mattress.position.set(0, 0.525, 0);
        bedGroup.add(mattress);
        // ベッドをカメラの正面奥に配置
        bedGroup.position.set(0, 0, -1.0);
        scene.add(bedGroup);

        // --- 2. VR空間内対応「空中追従3D字幕ボード」 ---
        const subtitleCanvas = document.createElement('canvas');
        subtitleCanvas.width = 1024; subtitleCanvas.height = 128;
        const subtitleCtx = subtitleCanvas.getContext('2d');
        const subtitleTexture = new THREE.CanvasTexture(subtitleCanvas);
        const subtitleMaterial = new THREE.MeshBasicMaterial({ map: subtitleTexture, transparent: true });
        const subtitleMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.18), subtitleMaterial);
        scene.add(subtitleMesh);

        function setVRSubtitle(text) {
            subtitleCtx.clearRect(0, 0, 1024, 128);
            subtitleCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            subtitleCtx.fillRect(0, 0, 1024, 128);
            subtitleCtx.fillStyle = '#ff1493';
            subtitleCtx.font = 'bold 36px sans-serif';
            subtitleCtx.textAlign = 'center';
            subtitleCtx.textBaseline = 'middle';
            subtitleCtx.fillText(text, 512, 64);
            subtitleTexture.needsUpdate = true;
        }

        // --- 3. プレイヤーの股間に「完全センター軸固定のちんぽ」を配置 ---
        const bodyChinGroup = new THREE.Group();
        const bodyChinMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.028, 0.26, 16), new THREE.MeshStandardMaterial({ color: 0xff1493, roughness: 0.35 }));
        bodyChinMesh.rotation.x = Math.PI / 2; 
        bodyChinMesh.position.set(0, 0, -0.13); // 完全に中央
        bodyChinGroup.add(bodyChinMesh);
        scene.add(bodyChinGroup);

        // --- 4. 操作パネル（物理タップ式＆スマホレイスター対応） ---
        const panelGroup = new THREE.Group();
        const board = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.8), new THREE.MeshStandardMaterial({ color: 0x151515 }));
        panelGroup.add(board);

        const poseLabels = [
            "通常立ち", "M字開脚", "四つん這い", "クンニ奉仕",
            "自動手コキ", "自動フェラ", "自動本番", "自動パイズリ",
            "玩具:なし", "玩具:ローター", "玩具:オナホ", "衣服:着衣", "衣服:全裸"
        ];
        const poseIds = [
            "stand", "mleg", "quad", "kunni",
            "autohand", "autofella", "autosex", "autopaizuri",
            "toy_none", "toy_rotor", "toy_onaho", "cloth_on", "cloth_off"
        ];
        const buttonMeshes = [];

        function createButtonTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const context = canvas.getContext('2d');
            if(text.startsWith("玩具:")) context.fillStyle = '#4b0082';
            else if(text.startsWith("衣服:")) context.fillStyle = '#228b22';
            else context.fillStyle = '#ff69b4';
            
            context.fillRect(0, 0, 256, 128);
            context.fillStyle = '#ffffff';
            context.font = 'bold 32px sans-serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, 128, 64);
            return new THREE.CanvasTexture(canvas);
        }

        for(let i=0; i<poseLabels.length; i++) {
            const tex = createButtonTexture(poseLabels[i]);
            const btnMat = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff, emissiveIntensity: 0.1 });
            const btnMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.05), btnMat); 
            const col = i % 4; const row = Math.floor(i / 4);
            btnMesh.position.set(-0.6 + col * 0.42, 0.55 - row * 0.28, 0.025);
            btnMesh.userData = { poseId: poseIds[i], isPressed: false };
            panelGroup.add(btnMesh);
            buttonMeshes.push(btnMesh);
        }
        // スマホでも見やすく押し逃しのない位置にパネルを配置
        panelGroup.position.set(-1.1, 1.1, -0.6);
        panelGroup.rotation.y = Math.PI / 3.5;
        scene.add(panelGroup);

        // レイキャスト（スマホタップ用ボタン判定）
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (isVRMode || !uiVisible) return;
            // UIエリアの誤操作を防止
            if (e.clientX < 180 && e.clientY > window.innerHeight - 180) return;
            if (e.clientX > window.innerWidth - 150 && e.clientY > window.innerHeight - 150) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buttonMeshes);
            if (intersects.length > 0) {
                const clickedBtn = intersects[0].object;
                applyPose(clickedBtn.userData.poseId);
                clickedBtn.material.emissiveIntensity = 0.8;
                setTimeout(() => clickedBtn.material.emissiveIntensity = 0.1, 180);
            }
        });

        // --- 5. 女の子の設定＆ポーズ・Hなご奉仕位置の修正 ---
        let girlModel = null;
        let b = {}; 
        let currentPose = "stand";
        let isNude = false;
        const loader = new THREE.GLTFLoader();
        const modelUrl = '8535350609400951985.vrm.glb';

        function initSystem() {
            renderer.xr.enabled = isVRMode;
            
            loader.load(modelUrl, function (gltf) {
                girlModel = gltf.scene;
                scene.add(girlModel);
                
                girlModel.traverse((child) => {
                    if (child.isBone) {
                        const name = child.name.toLowerCase();
                        if (name.includes('head') || name.includes('j_bnd_c_head')) b.head = child;
                        if (name.includes('spine') || name.includes('j_bnd_c_spine')) b.spine = child;
                        if (name.includes('hips') || name.includes('j_bnd_c_hips')) b.hips = child;
                        if (name.includes('leftupperarm') || name.includes('j_bnd_l_upperarm')) b.lArm = child;
                        if (name.includes('rightupperarm') || name.includes('j_bnd_r_upperarm')) b.rArm = child;
                        if (name.includes('leftupperleg') || name.includes('j_bnd_l_upperleg')) b.lLeg = child;
                        if (name.includes('rightupperleg') || name.includes('j_bnd_r_upperleg')) b.rLeg = child;
                    }
                });
                applyPose("stand");
                document.getElementById('loading').style.display = 'none';
                startLoop();
            });
        }

        const sexQuotes = ["女の子：『んほぉぉ！おっきいのがナカでガクガク暴れてるぅぅ！！』", "女の子：『そこッ、まんこの奥の、一番気持ちいいトコ突かれてるぅ、いくぅぅ！』"];
        const fellaQuotes = ["女の子：『んちゅ、じゅぶぅ…お口の奥まで入ってきて苦しいっ、でも気持ちいい…んむぅ』", "女の子：『れろ、れろぉ…お汁いっぱいでちんぽ美味しい…ジュブジュブうぅ…』"];
        const handQuotes = ["女の子：『私の手でシコシコ…おっきいおねだり棒がビクビク跳ねてるよぉ…♪』"];
        const paizuriQuotes = ["女の子：『お胸でギューッて挟んであげる…っ、私の乳首、ちんぽに擦れて気持ちいい…っ///』", "女の子：『はぁ、はぁっ…！お胸の谷間でシコシコするの、すっごくエロいよぉ…♪』"];
        const kunniQuotes = ["女の子：『あぁっ、舌でそんなにクチュクチュされたらお汁止まんなくなっちゃうぅぅ！！』"];

        // 【ガチ修正】どんなVRMモデルの衣服も強制的に剥ぎ取る強力な全裸化ロジック
        function toggleNude(nudeState) {
            isNude = nudeState;
            if(!girlModel) return;
            girlModel.traverse((child) => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();
                    // 体、肌、顔、目、頭以外のパーツ（＝服や装飾品）を全て完全に消去
                    if (name.includes('body') || name.includes('skin') || name.includes('face') || name.includes('eye') || name.includes('head') || name.includes('hair')) {
                        child.visible = true;
                    } else {
                        child.visible = !isNude; // 衣服判定メッシュを確実に非表示に
                    }
                }
            });
        }

        // H奉仕時の位置ズレ・不自然なポーズの修正
        function applyPose(poseName) {
            if (poseName.startsWith("toy_")) { currentToy = poseName; updateToyVisibility(); return; }
            if (poseName === "cloth_on") { toggleNude(false); return; }
            if (poseName === "cloth_off") { toggleNude(true); return; }

            currentPose = poseName;
            if (!girlModel) return;

            // 各種座標リセット（ベッド高 0.65m に合わせる）
            girlModel.position.set(0, 0.65, -1.0);
            girlModel.rotation.set(0, Math.PI, 0);
            Object.values(b).forEach(bone => { if(bone) bone.rotation.set(0, 0, 0); });

            if (poseName === "stand") {
                girlModel.position.set(0, 0, -0.6); 
                if (b.lArm) b.lArm.rotation.z = -Math.PI / 3;
                if (b.rArm) b.rArm.rotation.z = Math.PI / 3;
                setVRSubtitle("女の子：『いつでもエッチしていいんだよ…？おねだりして？///』");
            } 
            else if (poseName === "mleg") {
                girlModel.position.set(0, 0.75, -0.8);
                girlModel.rotation.set(-Math.PI / 3, 0, 0);
                if (b.lLeg) { b.lLeg.rotation.x = -Math.PI / 2.2; b.lLeg.rotation.z = Math.PI / 4; }
                if (b.rLeg) { b.rLeg.rotation.x = -Math.PI / 2.2; b.rLeg.rotation.z = -Math.PI / 4; }
                setVRSubtitle("女の子：『M字開脚…奥まで全部見えちゃうよぉ…ッ///』");
            } 
            else if (poseName === "quad") {
                girlModel.position.set(0, 0.65, -0.9);
                girlModel.rotation.set(0, 0, 0); // プレイヤーにお尻を向ける
                if (b.spine) b.spine.rotation.x = Math.PI / 4; 
                if (b.lLeg) b.lLeg.rotation.x = -Math.PI / 2; if (b.rLeg) b.rLeg.rotation.x = -Math.PI / 2;
                setVRSubtitle("女の子：『お尻突き出すの、すっごく恥ずかしい…///』");
            }
            else if (poseName === "kunni") {
                girlModel.position.set(0, 0.8, -0.5);
                girlModel.rotation.set(-Math.PI / 3.5, 0, 0);
                setVRSubtitle("女の子：『あんっ！そこお口で直接ペロペロされるの、恥ずかしくて狂っちゃうよぉぉ！』");
            }
            else if (poseName === "autohand") {
                girlModel.position.set(0, 0.65, -0.45);
                setVRSubtitle("女の子：『手コキでいっぱい気持ちよくしてあげるね…♪』");
            }
            else if (poseName === "autofella") {
                // プレイヤーの股間の目の前に女の子の顔を密着させる位置修正
                girlModel.position.set(0, 0.35, -0.4);
                if (b.spine) b.spine.rotation.x = Math.PI / 5;
                setVRSubtitle("女の子：『んちゅ…お口でじゅぶじゅぶ、いっぱいしゃぶってあげる…んむぅ』");
            }
            else if (poseName === "autsex") {
                // 正常な挿入位置に配置
                girlModel.position.set(0, 0.7, -0.45);
                girlModel.rotation.set(-Math.PI / 2.2, 0, 0); 
                if (b.lLeg) { b.lLeg.rotation.x = -Math.PI / 2; b.lLeg.rotation.z = Math.PI / 3; }
                if (b.rLeg) { b.rLeg.rotation.x = -Math.PI / 2; b.rLeg.rotation.z = -Math.PI / 3; }
                setVRSubtitle("女の子：『あぁっ！ちんぽ入ってきたぁ！自動でナカいっぱいかき回してぇぇ！！』");
            }
            else if (poseName === "autopaizuri") {
                girlModel.position.set(0, 0.55, -0.42);
                if (b.lArm) { b.lArm.rotation.set(-Math.PI/4, Math.PI/6, Math.PI/10); }
                if (b.rArm) { b.rArm.rotation.set(-Math.PI/4, -Math.PI/6, -Math.PI/10); }
                setVRSubtitle("女の子：『私の大きなお胸で挟んであげる…んっ、パイズリで気持ちよくなってね？///』");
            }
        }

        // --- 6. コントローラー設定 ---
        const controller1 = renderer.xr.getController(0); userGroup.add(controller1); 
        const controller2 = renderer.xr.getController(1); userGroup.add(controller2); 

        let currentToy = "toy_none";
        const toyGroup = new THREE.Group();
        const rotorMesh = new THREE.Mesh(new THREE.SphereGeometry(0.023, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff00ff }));
        rotorMesh.scale.set(1, 1, 1.8); rotorMesh.position.set(0, 0, -0.05); rotorMesh.name = "rotor";
        toyGroup.add(rotorMesh);
        const onahoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.14, 16), new THREE.MeshStandardMaterial({ color: 0xffc0cb }));
        onahoMesh.rotation.x = Math.PI / 2; onahoMesh.position.set(0, 0, -0.08); onahoMesh.name = "onaho";
        toyGroup.add(onahoMesh);
        controller2.add(toyGroup);

        function updateToyVisibility() {
            toyGroup.children.forEach(child => {
                if (currentToy === "toy_rotor" && child.name === "rotor") child.visible = true;
                else if (currentToy === "toy_onaho" && child.name === "onaho") child.visible = true;
                else child.visible = false;
            });
        }
        updateToyVisibility();

        // VRモード用物理押し込みパネル判定
        function checkPanelTap(session) {
            const c1Pos = new THREE.Vector3(); controller1.getWorldPosition(c1Pos);
            buttonMeshes.forEach(btn => {
                const btnPos = new THREE.Vector3(); btn.getWorldPosition(btnPos);
                const distance = c1Pos.distanceTo(btnPos);
                if (distance < 0.10) { 
                    if (!btn.userData.isPressed) {
                        btn.userData.isPressed = true;
                        btn.material.emissiveIntensity = 0.9;
                        pulseController(session, 'left', 0.6, 60); 
                        applyPose(btn.userData.poseId);
                    }
                } else if (distance > 0.14) {
                    btn.userData.isPressed = false;
                    btn.material.emissiveIntensity = 0.1;
                }
            });
        }

        // --- 7. ミルク射出システム ---
        const milkParticles = [];
        function shootSituationMilk() {
            const tipPos = new THREE.Vector3(0, 0, -0.25).applyMatrix4(bodyChinGroup.matrixWorld);
            let count = 28; let speedBase = 0.09;

            if (currentPose === "autosex") {
                count = 40; speedBase = 0.02; 
                setVRSubtitle("女の子：『んほぉぉーーッ！！子宮に熱いのイッパイ出たぁ！ナカだし最高にきもちいいぃぃっ！！』");
            } else if (currentPose === "autofella") {
                setVRSubtitle("女の子：『んぐぅ、ジュポ、ごくんっ…！ちんぽミルク喉の奥にいっぱい入ってきたぁ…ゲホッ、んちゅ』");
            } else if (currentPose === "autopaizuri") {
                setVRSubtitle("女の子：『ゃぁあぁっ！お胸にドロドロの特製ミルクがいっぱいかかっちゃったぁ…っ///』");
            } else {
                setVRSubtitle("女の子：『ひゃあああぁッ！！ミルクが勢いよくドピュドピュ飛んできたぁぁーーっ！！』");
            }

            for(let i=0; i<count; i++) {
                const pMesh = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                pMesh.position.copy(tipPos);
                
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(bodyChinGroup.quaternion);
                dir.x += (Math.random() - 0.5) * 0.22;
                dir.y += (Math.random() - 0.5) * 0.22 + (currentPose === "autosex" ? -0.04 : 0.1); 
                dir.z += (Math.random() - 0.5) * 0.22;
                dir.normalize();

                pMesh.userData = {
                    velocity: dir.multiplyScalar(speedBase + Math.random() * 0.04),
                    gravity: currentPose === "autosex" ? 0.0007 : 0.0022,
                    life: currentPose === "autosex" ? 130 : 70 
                };
                scene.add(pMesh);
                milkParticles.push(pMesh);
            }
        }

        function updateMilkParticles() {
            for(let i = milkParticles.length - 1; i >= 0; i--) {
                const p = milkParticles[i];
                p.position.add(p.userData.velocity);
                p.userData.velocity.y -= p.userData.gravity;
                p.userData.life--;
                if(p.userData.life <= 0) { scene.remove(p); milkParticles.splice(i, 1); }
            }
        }

        // --- 8. なめらかなループアニメーション処理 ---
        let speechTimeout = 0; let macroTimer = 0;

        function checkEroCollision(session) {
            if (!girlModel) return;
            const now = Date.now();

            // なめらかピストン・奉仕アニメーション（カクつきを完全排除）
            macroTimer += 0.12; 
            if (currentPose === "autohand") {
                if(b.rArm) b.rArm.rotation.x = Math.sin(macroTimer) * 0.35;
                if(isVRMode) pulseController(session, 'right', 0.35, 20);
                if (now > speechTimeout) { speechTimeout = now + 3000; setVRSubtitle(handQuotes[Math.floor(Math.random() * handQuotes.length)]); }
            }
            else if (currentPose === "autofella") {
                if(b.head) b.head.rotation.x = (Math.sin(macroTimer * 1.5) * 0.2) + 0.1;
                if(isVRMode) pulseController(session, 'right', 0.45, 25);
                if (now > speechTimeout) { speechTimeout = now + 3000; setVRSubtitle(fellaQuotes[Math.floor(Math.random() * fellaQuotes.length)]); }
            }
            else if (currentPose === "autosex") {
                // 前後ピストンを滑らかに連動
                girlModel.position.z = -0.45 + Math.sin(macroTimer * 1.8) * 0.08; 
                if(isVRMode) pulseController(session, 'right', 0.9, 45); 
                if (now > speechTimeout) { speechTimeout = now + 2800; setVRSubtitle(sexQuotes[Math.floor(Math.random() * sexQuotes.length)]); }
            }
            else if (currentPose === "autopaizuri") {
                girlModel.position.z = -0.42 + Math.sin(macroTimer * 1.4) * 0.06; 
                if(isVRMode) pulseController(session, 'right', 0.55, 30); 
                if (now > speechTimeout) { speechTimeout = now + 3000; setVRSubtitle(paizuriQuotes[Math.floor(Math.random() * paizuriQuotes.length)]); }
            }
            else if (currentPose === "kunni") {
                if (now > speechTimeout) { speechTimeout = now + 3000; setVRSubtitle(kunniQuotes[0]); }
            }
        }

        function pulseController(session, hand, intensity, duration) {
            if(!session) return;
            for (const src of session.inputSources) {
                if (src.handedness === hand && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0]) {
                    src.gamepad.hapticActuators[0].pulse(intensity, duration);
                }
            }
        }

        // --- 9. スマホ専用 操作スティックシステム ---
        let joystickActive = false;
        let joystickMove = { x: 0, y: 0 };
        const stickContainer = document.getElementById('joystick-container');
        const stickKnob = document.getElementById('joystick-knob');

        stickContainer.addEventListener('pointerdown', (e) => { joystickActive = true; handleStickMove(e); });
        window.addEventListener('pointermove', (e) => { if (joystickActive) handleStickMove(e); });
        window.addEventListener('pointerup', () => {
            joystickActive = false; joystickMove = { x: 0, y: 0 };
            stickKnob.style.transform = `translate(0px, 0px)`;
        });

        function handleStickMove(e) {
            const rect = stickContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = e.clientX - centerX;
            let dy = e.clientY - centerY;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
            const angle = Math.atan2(dy, dx);
            
            const moveX = Math.cos(angle) * dist;
            const moveY = Math.sin(angle) * dist;
            stickKnob.style.transform = `translate(${moveX}px, ${moveY}px)`;
            
            joystickMove.x = moveX / 45;
            joystickMove.y = moveY / 45;
        }

        document.getElementById('shoot-btn').addEventListener('pointerdown', () => { shootSituationMilk(); });

        let rightTriggerReset = true;
        let xrSession = null;
        function onVRStart() {
            navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then(function (session) {
                renderer.xr.setSession(session);
                xrSession = session;
            });
        }

        // --- 10. メインループ ---
        function startLoop() {
            renderer.setAnimationLoop(function () {
                // ちんぽの位置をプレイヤーの股間に完全追従
                bodyChinGroup.position.copy(userGroup.position);
                bodyChinGroup.position.y = userGroup.position.y - 0.25; // 視点から0.25m下に配置
                bodyChinGroup.rotation.y = userGroup.rotation.y;

                updateMilkParticles();
                checkEroCollision(xrSession);

                // 3D字幕をプレイヤーの視界の正面に滑らかに追従させる
                const subPos = new THREE.Vector3(0, 0.2, -1.0).applyMatrix4(camera.matrixWorld);
                subtitleMesh.position.copy(subPos);
                subtitleMesh.quaternion.copy(camera.quaternion);

                if (xrSession) {
                    checkPanelTap(xrSession);
                    for (const source of xrSession.inputSources) {
                        if (source.gamepad && source.gamepad.axes) {
                            const axes = source.gamepad.axes; const buttons = source.gamepad.buttons;
                            if (source.handedness === 'left' && axes.length >= 4) {
                                const speed = 0.03;
                                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                                const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                                forward.y = 0; side.y = 0; forward.normalize(); side.normalize();
                                userGroup.position.addScaledVector(forward, -axes[3] * speed);
                                userGroup.position.addScaledVector(side, axes[2] * speed);
                            }
                            if (source.handedness === 'right' && axes.length >= 4) {
                                if (Math.abs(axes[2]) > 0.4) userGroup.rotation.y -= axes[2] * 0.03; 
                                if (buttons[0] && buttons[0].pressed) {
                                    if (rightTriggerReset) { rightTriggerReset = false; shootSituationMilk(); pulseController(xrSession, 'right', 1.0, 300); }
                                } else { rightTriggerReset = true; }
                            }
                        }
                    }
                } else {
                    // スマホスティック移動
                    if (joystickActive) {
                        const speed = 0.025;
                        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                        const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                        forward.y = 0; side.y = 0; forward.normalize(); side.normalize();
                        userGroup.position.addScaledVector(forward, -joystickMove.y * speed);
                        userGroup.position.addScaledVector(side, joystickMove.x * speed);
                    }
                }
                renderer.render(scene, camera);
            });
        }

        // スマホ用ドラッグ視点変更（女の子を中心に滑らかに見回せるよう改善）
        let isDragging = false; let previousMousePosition = { x: 0, y: 0 };
        window.addEventListener('pointerdown', (e) => {
            if (isVRMode) return;
            // 操作ボタン類の上をタップした時は視点移動をパス
            if (e.clientX < 180 && e.clientY > window.innerHeight - 180) return;
            if (e.clientX > window.innerWidth - 150 && e.clientY > window.innerHeight - 150) return;
            isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging || isVRMode) return;
            const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
            userGroup.rotation.y -= deltaMove.x * 0.006;
            camera.rotation.x -= deltaMove.y * 0.004;
            // 視点の上下角度に限界を設定（首が反り返るのを防止）
            camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, camera.rotation.x));
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointerup', () => isDragging = false);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
