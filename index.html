<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Girl TEST</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene movement-controls="speed: 0.1">
      
      <a-sky color="#87CEEB"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#7CFC00"></a-plane>

      <a-image src="https://cdn.phototourl.com/free/2026-06-02-48a18d94-faa5-4995-8e33-33ae4dd96ccc.jpg" 
               position="0 1.5 -3" 
               width="1.5" 
               height="2.2">
      </a-image>

      <a-entity id="rig" movement-controls>
        <a-entity camera position="0 1.6 0" look-controls></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
