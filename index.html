<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VRイチャイチャ体験Web</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- 3Dを動かすためのライブラリを読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #subtitles {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #fff; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 4px #000, -2px -2px 4px #000;
            pointer-events: none; z-index: 10;
        }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: #aaa; font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">画面をドラッグ（またはコントローラー）でなでなで / 近づくとリアクション</div>
    <div id="subtitles">（女の子がこちらを見つめている…）</div>

    <script>
        // 1. 3D空間の基本設定
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff0f5); // 可愛いラベンダーピンクの部屋

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 1.2); // プレイヤーの目線の高さ

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ライト（明かり）
        const light = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(light);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 2. 簡易女の子アバターの作成
        const girl = new THREE.Group();
        
        // 体（ピンク）
        const bodyGeo = new THREE.CapsuleGeometry(0.2, 0.6, 8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.6;
        girl.add(body);

        // 頭（白）
        const headGeo = new THREE.SphereGeometry(0.2, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.3;
        girl.add(head);

        scene.add(girl);

        // 字幕の要素
        const subtitles = document.getElementById('subtitles');

        // 3. マウス・タッチでのなでなで・接近処理
        let isPointerDown = false;
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function checkInteraction(event) {
            // 画面上の位置を取得
            const x = (event.clientX || event.touches[0].clientX);
            const y = (event.clientY || event.touches[0].clientY);
            pointer.x = (x / window.innerWidth) * 2 - 1;
            pointer.y = -(y / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObject(head);

            if (intersects.length > 0) {
                // 頭に触れている（なでなで中）
                headMat.color.setHex(0xffd700); // 黄色（笑顔）
                subtitles.innerText = "女の子：『あうぅ…// なでなでするの、きもちいい…？』";
            } else {
                // 触れていない時の距離判定
                const dist = camera.position.distanceTo(girl.position);
                if (dist < 0.8) {
                    headMat.color.setHex(0xff4500); // 赤（照れ顔）
                    subtitles.innerText = "女の子：『ちょっと、急に近すぎるよ……///』";
                } else {
                    headMat.color.setHex(0xffffff); // 白（通常）
                    subtitles.innerText = "女の子：『ねえねえ、もっとこっち来て？』";
                }
            }
        }

        // イベント登録（マウスとスマホのタッチに対応）
        window.addEventListener('pointerdown', (e) => { isPointerDown = true; checkInteraction(e); });
        window.addEventListener('pointermove', (e) => { if(isPointerDown) checkInteraction(e); });
        window.addEventListener('pointerup', () => { 
            isPointerDown = false; 
            headMat.color.setHex(0xffffff);
            subtitles.innerText = "女の子：『あ、なでなでやめちゃうの…？』";
        });

        // 4. アニメーションループ（常に動く処理）
        function animate() {
            requestAnimationFrame(animate);

            // 女の子の頭が常にカメラ（あなた）の方向を向く（目線追従）
            head.lookAt(camera.position);

            // 女の子を少しだけゆらゆらさせて、生きてる感を出す
            girl.position.y = Math.sin(Date.now() * 0.002) * 0.02;

            renderer.render(scene, camera);
        }
        animate();

        // 画面サイズ変更への対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
