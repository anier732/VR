<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quest 3S完全対応 特設VRルーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #subtitles {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #fff; font-size: 26px; font-weight: bold;
            text-shadow: 3px 3px 6px #000, -3px -3px 6px #000; pointer-events: none; z-index: 10;
        }
        #vr-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: #ff69b4; color: white; font-size: 20px;
            font-weight: bold; border: none; border-radius: 10px; cursor: pointer; z-index: 999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: none;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 22px; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">特別なお部屋を準備中...</div>
    <div id="subtitles">（Quest 3Sのブラウザで開いて、下のボタンを押してね）</div>
    <button id="vr-button">VRモードを起動する</button>

    <script>
        // --- 1. 3D空間・カメラ・移動用グループの設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5ebe0);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const userGroup = new THREE.Group();
        userGroup.add(camera);
        scene.add(userGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.xr.enabled = true; 
        document.body.appendChild(renderer.domElement);

        // 明るいライト環境
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const roomLight = new THREE.PointLight(0xfff0dd, 0.9, 10);
        roomLight.position.set(0, 2.5, 0);
        scene.add(roomLight);

        // お部屋とベッドの作成
        const roomGroup = new THREE.Group();
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.5 }));
        floor.rotation.x = -Math.PI / 2;
        roomGroup.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfaedcd });
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3), wallMat);
        backWall.position.set(0, 1.5, -4);
        roomGroup.add(backWall);
        scene.add(roomGroup);

        const bedGroup = new THREE.Group();
        const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.3, 2.2), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
        bedFrame.position.set(0, 0.15, 0);
        bedGroup.add(bedFrame);
        const mattress = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.2, 2.15), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }));
        mattress.position.set(0, 0.3, 0);
        bedGroup.add(mattress);
        const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.1, 0.4), new THREE.MeshStandardMaterial({ color: 0xffb6c1 }));
        pillow.position.set(0, 0.4, -0.8);
        bedGroup.add(pillow);
        bedGroup.position.set(0, 0, -1.5);
        scene.add(bedGroup);

        // --- ★新機能：壁掛けのポーズ指定パネルボード ---
        const panelGroup = new THREE.Group();
        // パネルの背景板（壁に設置）
        const boardGeo = new THREE.PlaneGeometry(1.2, 0.8);
        const boardMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
        const board = new THREE.Mesh(boardGeo, boardMat);
        panelGroup.add(board);

        // ボタンの立体を並べる（7つのポーズ分）
        const btnGeo = new THREE.BoxGeometry(0.25, 0.15, 0.03);
        const btnColors = [0xff69b4, 0x4169e1, 0x32cd32, 0xffa500, 0x9370db, 0x00ffff, 0xff1493];
        const poseIds = ["stand", "footshow", "quad", "lie", "revquad", "mleg", "armpit"];
        const buttonMeshes = [];

        // 2列に分けてボタンを配置
        for(let i=0; i<7; i++) {
            const btnMat = new THREE.MeshStandardMaterial({ color: btnColors[i], emissive: btnColors[i], emissiveIntensity: 0.2 });
            const btnMesh = new THREE.Mesh(btnGeo, btnMat);
            
            // 配置の計算（左列と右列）
            const col = i % 2;
            const row = Math.floor(i / 2);
            btnMesh.position.set(-0.3 + col * 0.6, 0.25 - row * 0.22, 0.02);
            btnMesh.userData = { poseId: poseIds[i] }; // ボタンにポーズ名を覚えさせる
            panelGroup.add(btnMesh);
            buttonMeshes.push(btnMesh);
        }
        // パネルをプレイヤーの「左側の壁（高さ1.3m）」に設置
        panelGroup.position.set(-2.5, 1.3, -1.5);
        panelGroup.rotation.y = Math.PI / 3; // 少しプレイヤー側に向ける
        scene.add(panelGroup);


        // --- 2. 女の子のロードと関節（ボーン）の取得 ---
        let girlModel = null;
        let b = {}; // 関etsのショートカット用
        let currentPose = "stand";

        const loader = new THREE.GLTFLoader();
        const modelUrl = '8535350609400951985.vrm.glb';

        loader.load(modelUrl, function (gltf) {
            girlModel = gltf.scene;
            scene.add(girlModel);
            
            girlModel.traverse((child) => {
                if (child.isBone) {
                    const name = child.name.toLowerCase();
                    if (name.includes('head') || name.includes('j_bnd_c_head')) b.head = child;
                    if (name.includes('neck') || name.includes('j_bnd_c_neck')) b.neck = child;
                    if (name.includes('spine') || name.includes('j_bnd_c_spine')) b.spine = child;
                    if (name.includes('hips') || name.includes('j_bnd_c_hips')) b.hips = child;
                    
                    if (name.includes('leftupperarm') || name.includes('j_bnd_l_upperarm')) b.lArm = child;
                    if (name.includes('rightupperarm') || name.includes('j_bnd_r_upperarm')) b.rArm = child;
                    if (name.includes('leftforearm') || name.includes('j_bnd_l_forearm')) b.lElbow = child;
                    if (name.includes('rightforearm') || name.includes('j_bnd_r_forearm')) b.rElbow = child;
                    
                    if (name.includes('leftupperleg') || name.includes('j_bnd_l_upperleg')) b.lLeg = child;
                    if (name.includes('rightupperleg') || name.includes('j_bnd_r_upperleg')) b.rLeg = child;
                    if (name.includes('leftlowerleg') || name.includes('j_bnd_l_lowerleg')) b.lKnee = child;
                    if (name.includes('rightlowerleg') || name.includes('j_bnd_r_lowerleg')) b.rKnee = child;
                    if (name.includes('leftfoot') || name.includes('j_bnd_l_foot')) b.lFoot = child;
                    if (name.includes('rightfoot') || name.includes('j_bnd_r_foot')) b.rFoot = child;
                }
            });

            applyPose("stand");
            document.getElementById('loading').style.display = 'none';
            document.getElementById('subtitles').innerText = "女の子：『左の壁のボタンで、好きなポーズにしていいよ…？///』";
            
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
                    if (supported) {
                        const btn = document.getElementById('vr-button');
                        btn.style.display = 'block';
                        btn.addEventListener('click', onVRButtonClick);
                    }
                });
            }
        }, null, function (err) {
            document.getElementById('loading').innerText = "ロードエラー。";
        });

        // --- ★新機能：あらゆる過激シチュエーションを再現するポーズ設定システム ---
        function applyPose(poseName) {
            currentPose = poseName;
            if (!girlModel) return;

            // 全関節の回転と位置をリセット
            girlModel.position.set(0, 0, -1.5);
            girlModel.rotation.set(0, Math.PI, 0);
            Object.values(b).forEach(bone => { if(bone) bone.rotation.set(0, 0, 0); });

            const subtitles = document.getElementById('subtitles');

            if (poseName === "stand") {
                // 【1. 普通に立つ】
                girlModel.position.set(0, 0, -0.4); 
                if (b.lArm) b.lArm.rotation.z = -Math.PI / 3;
                if (b.rArm) b.rArm.rotation.z = Math.PI / 3;
                subtitles.innerText = "女の子：『立ちポーズだよ。お部屋、ゆっくり見てね？』";
            } 
            else if (poseName === "footshow") {
                // 【2. ベッドで足裏見せつけ】仰向けで片足をこちらに突き出す
                girlModel.position.set(0, 0.45, -1.4);
                girlModel.rotation.set(-Math.PI / 2, 0, 0); // 仰向け寝
                if (b.lLeg) { b.lLeg.rotation.x = -Math.PI / 2.5; b.lLeg.rotation.z = Math.PI / 8; } // 左足を大きく持ち上げる
                if (b.lKnee) b.lKnee.rotation.x = Math.PI / 6; // 膝を少し緩める
                if (b.lFoot) b.lFoot.rotation.x = -Math.PI / 6; // つま先をプレイヤーに向ける
                if (b.rLeg) b.rLeg.rotation.x = -Math.PI / 12; // 右足は伸ばす
                if (b.lArm) b.lArm.rotation.z = -Math.PI / 4;
                if (b.rArm) b.rArm.rotation.z = Math.PI / 4;
                subtitles.innerText = "女の子：『あ、足の裏…そんなにじっくり見られるの恥ずかしいよぉ…///』";
            } 
            else if (poseName === "quad") {
                // 【3. 四つん這い】ベッドの上でうつ伏せになり腰を上げる
                girlModel.position.set(0, 0.45, -1.5);
                girlModel.rotation.set(0, Math.PI, 0); // 正面向き
                if (b.spine) b.spine.rotation.x = Math.PI / 2.5; // 上半身を前に倒す
                if (b.lLeg) { b.lLeg.rotation.x = -Math.PI / 2; b.lLeg.rotation.y = -Math.PI / 12; } // 太ももを垂直に
                if (b.rLeg) { b.rLeg.rotation.x = -Math.PI / 2; b.rLeg.rotation.y = Math.PI / 12; }
                if (b.lKnee) b.lKnee.rotation.x = Math.PI / 2; // 膝をつく
                if (b.rKnee) b.rKnee.rotation.x = Math.PI / 2;
                if (b.lArm) { b.lArm.rotation.x = Math.PI / 3; b.lArm.rotation.z = -Math.PI / 12; } // 手をつく
                if (b.rArm) { b.rArm.rotation.x = Math.PI / 3; b.rArm.rotation.z = Math.PI / 12; }
                if (b.head) b.head.rotation.x = -Math.PI / 4; // 顔を少し上げる
                subtitles.innerText = "女の子：『よ、四つん這い…？このポーズ、後ろから見られてるみたいで変な感じ…///』";
            } 
            else if (poseName === "lie") {
                // 【4. 仰向け】
                girlModel.position.set(0, 0.45, -1.5);
                girlModel.rotation.set(-Math.PI / 2, 0, 0);
                if (b.lArm) b.lArm.rotation.z = -Math.PI / 6;
                if (b.rArm) b.rArm.rotation.z = Math.PI / 6;
                subtitles.innerText = "女の子：『ふぅ、ゴロゴロモード。隣にいつでもおいで？』";
            } 
            else if (poseName === "revquad") {
                // 【5. 逆四つん這い（ブリッジ型）】お腹を上にして四肢で支える
                girlModel.position.set(0, 0.45, -1.5);
                girlModel.rotation.set(-Math.PI / 2, 0, 0);
                if (b.hips) b.hips.position.y = 0.3; // お尻を持ち上げる
                if (b.lLeg) b.lLeg.rotation.x = -Math.PI / 3;
                if (b.rLeg) b.rLeg.rotation.x = -Math.PI / 3;
                if (b.lKnee) b.Knee.rotation.x = Math.PI / 2;
                if (b.rKnee) b.rKnee.rotation.x = Math.PI / 2;
                if (b.lArm) b.lArm.rotation.x = -Math.PI / 2;
                if (b.rArm) b.rArm.rotation.x = -Math.PI / 2;
                subtitles.innerText = "女の子：『逆四つん這い…？お腹が丸見えで、すっごく恥ずかしい…///』";
            } 
            else if (poseName === "mleg") {
                // 【6. M字開脚】ベッドの上で仰向けになり、両膝を曲げて外側に大きく開く
                girlModel.position.set(0, 0.45, -1.4);
                girlModel.rotation.set(-Math.PI / 2, 0, 0);
                if (b.lLeg) { b.lLeg.rotation.x = -Math.PI / 2.2; b.lLeg.rotation.z = Math.PI / 3; } // M字に開く
                if (b.rLeg) { b.rLeg.rotation.x = -Math.PI / 2.2; b.rLeg.rotation.z = -Math.PI / 3; }
                if (b.lKnee) b.lKnee.rotation.x = Math.PI / 1.8; // 膝を深く曲げる
                if (b.rKnee) b.rKnee.rotation.x = Math.PI / 1.8;
                if (b.lArm) b.lArm.rotation.z = -Math.PI / 3;
                if (b.rArm) b.rArm.rotation.z = Math.PI / 3;
                subtitles.innerText = "女の子：『きゃ、脚をそんなに大きく広げるなんて無理ぃ！どこ見てるのっ///』";
            } 
            else if (poseName === "armpit") {
                // 【7. 脇見せつけ】立って両手を頭の後ろに回して脇を開く
                girlModel.position.set(0, 0, -0.4); 
                if (b.lArm) { b.lArm.rotation.x = -Math.PI / 1.2; b.lArm.rotation.z = -Math.PI / 4; } // 腕を上に上げる
                if (b.rArm) { b.rArm.rotation.x = -Math.PI / 1.2; b.rArm.rotation.z = Math.PI / 4; }
                if (b.lElbow) b.lElbow.rotation.y = -Math.PI / 2; // 手を頭の後ろへ
                if (b.rElbow) b.rElbow.rotation.y = Math.PI / 2;
                subtitles.innerText = "女の子：『両手を上げて…ワキ、見えてる…？変なフェチなんだからぁ…///』";
            }
        }

        // --- 3. コントローラーと「見える手（ピンク球）」の設定 ---
        const controller1 = renderer.xr.getController(0); userGroup.add(controller1);
        const controller2 = renderer.xr.getController(1); userGroup.add(controller2);

        const handGeometry = new THREE.SphereGeometry(0.06, 16, 16);
        const handMaterial = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.2 });
        const handMesh1 = new THREE.Mesh(handGeometry, handMaterial); controller1.add(handMesh1);
        const handMesh2 = new THREE.Mesh(handGeometry, handMaterial); controller2.add(handMesh2);

        // 【パネルタッチ判定】ピンクの手が壁のボタンに触れたかチェックするシステム
        function checkPanelTouch() {
            const c1Pos = new THREE.Vector3();
            const c2Pos = new THREE.Vector3();
            controller1.getWorldPosition(c1Pos);
            controller2.getWorldPosition(c2Pos);

            buttonMeshes.forEach(btn => {
                const btnPos = new THREE.Vector3();
                btn.getWorldPosition(btnPos);

                // コントローラー（右手か左手）がボタンの10cm以内に近づいたらスイッチON
                if (c1Pos.distanceTo(btnPos) < 0.10 || c2Pos.distanceTo(btnPos) < 0.10) {
                    if (!btn.userData.isHovered) {
                        btn.userData.isHovered = true;
                        btn.material.emissiveIntensity = 1.0; // ボタンをピカッと光らせる
                        applyPose(btn.userData.poseId); // ポーズ変更実行！
                        
                        // ポチッと押した時の感触（微振動）
                        if (xrSession) {
                            for (const src of xrSession.inputSources) {
                                if (src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0]) {
                                    src.gamepad.hapticActuators[0].pulse(0.3, 30);
                                }
                            }
                        }
                    }
                } else {
                    if (btn.userData.isHovered) {
                        btn.userData.isHovered = false;
                        btn.material.emissiveIntensity = 0.2; // 離れたら光を戻す
                    }
                }
            });
        }

        // --- 4. VRモードの開始・終了 ---
        let xrSession = null;
        function onVRButtonClick() {
            if (xrSession === null) {
                navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then(function (session) {
                    renderer.xr.setSession(session);
                    document.getElementById('vr-button').textContent = 'VRを終了する';
                    xrSession = session;
                });
            } else {
                xrSession.end();
                document.getElementById('vr-button').textContent = 'VRモードを起動する';
                xrSession = null;
            }
        }

        // --- 5. メインループ（毎フレーム実行） ---
        renderer.setAnimationLoop(function () {
            if (xrSession) {
                // 壁掛けパネルのタッチチェックを常時実行
                checkPanelTouch();

                // 左スティックで部屋を歩き回る
                for (const source of xrSession.inputSources) {
                    if (source.handedness === 'left' && source.gamepad) {
                        const axes = source.gamepad.axes;
                        if (axes && axes.length >= 4) {
                            const speed = 0.03;
                            userGroup.position.x += axes[2] * speed;
                            userGroup.position.z += axes[3] * speed;
                        }
                    }
                }
            }

            const headsetPos = new THREE.Vector3();
            camera.getWorldPosition(headsetPos);

            if (girlModel) {
                // 目線追従（仰向けや四つん這い以外の、顔が見えるポーズの時だけプレイヤーを向く）
                if (b.head && currentPose !== "lie" && currentPose !== "mleg" && currentPose !== "revquad") { 
                    b.head.lookAt(headsetPos); 
                }

                // 生きている呼吸ゆらゆら（ポーズごとに少し呼吸させる）
                const time = Date.now() * 0.002;
                if (currentPose === "stand" || currentPose === "armpit") {
                    girlModel.position.y += Math.sin(time) * 0.0005;
                }

                // なでなで判定（現在の女の子の頭の位置を自動取得）
                let girlHeadPos = new THREE.Vector3();
                if (b.head) {
                    b.head.getWorldPosition(girlHeadPos);
                } else {
                    girlHeadPos.set(girlModel.position.x, 1.35, girlModel.position.z);
                }

                const c1Pos = new THREE.Vector3();
                const c2Pos = new THREE.Vector3();
                controller1.getWorldPosition(c1Pos);
                controller2.getWorldPosition(c2Pos);

                if (c1Pos.distanceTo(girlHeadPos) < 0.22 || c2Pos.distanceTo(girlHeadPos) < 0.22) {
                    if (xrSession) {
                        for (const inputSource of xrSession.inputSources) {
                            if (inputSource.gamepad && inputSource.gamepad.hapticActuators && inputSource.gamepad.hapticActuators[0]) {
                                inputSource.gamepad.hapticActuators[0].pulse(0.12, 40);
                            }
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
