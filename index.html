<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Quest 3S完全対応 VRマイルーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #subtitles {
            position: absolute; bottom: 15%; width: 100%; text-align: center;
            color: #fff; font-size: 26px; font-weight: bold;
            text-shadow: 3px 3px 6px #000, -3px -3px 6px #000; pointer-events: none; z-index: 10;
        }
        #vr-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: #ff69b4; color: white; font-size: 20px;
            font-weight: bold; border: none; border-radius: 10px; cursor: pointer; z-index: 999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: none;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 22px; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">お部屋と女の子を準備中...</div>
    <div id="subtitles">（Quest 3Sのブラウザで開いて、下のボタンを押してね）</div>
    <button id="vr-button">VRモードを起動する</button>

    <script>
        // --- 1. 3D空間と移動用グループの設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5ebe0);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // 【重要】プレイヤーの移動（スティック操作）を可能にするためのグループ
        const userGroup = new THREE.Group();
        userGroup.add(camera);
        scene.add(userGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.xr.enabled = true; 
        document.body.appendChild(renderer.domElement);

        // ライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);
        const roomLight = new THREE.PointLight(0xfff0dd, 0.8, 10);
        roomLight.position.set(0, 2.5, 0);
        scene.add(roomLight);

        // 簡易マイルームの作成
        const roomGroup = new THREE.Group();
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.5 }));
        floor.rotation.x = -Math.PI / 2;
        roomGroup.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfaedcd });
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3), wallMat);
        backWall.position.set(0, 1.5, -4);
        roomGroup.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3), wallMat);
        leftWall.position.set(-4, 1.5, 0); leftWall.rotation.y = Math.PI / 2;
        roomGroup.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3), wallMat);
        rightWall.position.set(4, 1.5, 0); rightWall.rotation.y = -Math.PI / 2;
        roomGroup.add(rightWall);
        scene.add(roomGroup);

        // --- 2. 女の子のロードとTポーズ対策 ---
        let girlModel = null;
        let girlHeadBone = null;
        let leftArmBone = null;
        let rightArmBone = null;
        const loader = new THREE.GLTFLoader();

        const modelUrl = '8535350609400951985.vrm.glb';

        loader.load(modelUrl, function (gltf) {
            girlModel = gltf.scene;
            scene.add(girlModel);

            // 初期位置を少し遠く（1.5メートル先）に設定して全身を見やすく
            girlModel.position.set(0, 0, -1.5);
            girlModel.rotation.y = Math.PI; 

            // ボーンを探索して、Tポーズを可愛いポーズに強制修正する
            girlModel.traverse((child) => {
                if (child.isBone) {
                    const name = child.name.toLowerCase();
                    if (name.includes('head') || name.includes('j_bnd_c_head')) {
                        girlHeadBone = child;
                    }
                    // Tポーズ（腕が真横）を避けるため、両腕のボーンを少し下に下げる
                    if (name.includes('leftupperarm') || name.includes('j_bnd_l_upperarm')) {
                        leftArmBone = child;
                        leftArmBone.rotation.z = -Math.PI / 3; // 左腕を下げる
                    }
                    if (name.includes('rightupperarm') || name.includes('j_bnd_r_upperarm')) {
                        rightArmBone = child;
                        rightArmBone.rotation.z = Math.PI / 3; // 右腕を下げる
                    }
                }
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('subtitles').innerText = "女の子：『あ、私の手がみえる？こっちにおいでよ♪』";
            
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
                    if (supported) {
                        const btn = document.getElementById('vr-button');
                        btn.style.display = 'block';
                        btn.addEventListener('click', onVRButtonClick);
                    }
                });
            }
        }, null, function (err) {
            document.getElementById('loading').style.color = "red";
            document.getElementById('loading').innerText = "エラー。ファイルを確認してください。";
        });

        // --- 3. コントローラーと「見える手」の設定 ---
        const controller1 = renderer.xr.getController(0);
        userGroup.add(controller1); // userGroupに追加することで移動しても手がズレない
        const controller2 = renderer.xr.getController(1);
        userGroup.add(controller2);

        // 【新機能】自分の手（コントローラーの位置）にピンクの球体を表示する
        const handGeometry = new THREE.SphereGeometry(0.06, 16, 16);
        const handMaterial = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.2 });
        
        const handMesh1 = new THREE.Mesh(handGeometry, handMaterial);
        controller1.add(handMesh1);
        const handMesh2 = new THREE.Mesh(handGeometry, handMaterial);
        controller2.add(handMesh2);

        // --- 4. VRモードの開始・終了 ---
        let xrSession = null;
        function onVRButtonClick() {
            if (xrSession === null) {
                navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] }).then(function (session) {
                    renderer.xr.setSession(session);
                    document.getElementById('vr-button').textContent = 'VRを終了する';
                    xrSession = session;
                });
            } else {
                xrSession.end();
                document.getElementById('vr-button').textContent = 'VRモードを起動する';
                xrSession = null;
            }
        }

        // --- 5. メインループ（スティック移動・なでなで・呼吸） ---
        renderer.setAnimationLoop(function () {
            
            // 【新機能】コントローラーの「左スティック」で部屋を歩き回るシステム
            if (xrSession) {
                for (const source of xrSession.inputSources) {
                    // 左手側のコントローラーかつ、スティックデータがある場合
                    if (source.handedness === 'left' && source.gamepad) {
                        const axes = source.gamepad.axes; // axes[2]が左右、axes[3]が前後
                        if (axes && axes.length >= 4) {
                            const speed = 0.03; // 移動速度
                            // スティックの傾きに応じてプレイヤーの位置（userGroup）を動かす
                            userGroup.position.x += axes[2] * speed;
                            userGroup.position.z += axes[3] * speed;
                        }
                    }
                }
            }

            const headsetPos = new THREE.Vector3();
            camera.getWorldPosition(headsetPos);

            if (girlModel) {
                // 目線追従
                if (girlHeadBone) { 
                    girlHeadBone.lookAt(headsetPos); 
                }

                // プログラムで自作する「簡易呼吸モーション」
                // アニメーションデータがなくても、体と腕がわずかに波打って生きてる感を出す
                const time = Date.now() * 0.002;
                girlModel.position.y = Math.sin(time) * 0.005;
                if (leftArmBone) leftArmBone.rotation.x = Math.sin(time) * 0.03;
                if (rightArmBone) rightArmBone.rotation.x = Math.sin(time) * 0.03;

                // 距離判定
                const dist = headsetPos.distanceTo(girlModel.position);
                const subtitles = document.getElementById('subtitles');
                
                if (dist < 0.5) {
                    subtitles.innerText = "女の子：『ねえ、そんなに近づかれるとドキドキしちゃうよ……///』";
                } else if (dist < 1.0) {
                    subtitles.innerText = "女の子：『えへへ、近くに来てくれて嬉しい！手、見えてる？』";
                }

                // なでなで判定（ピンクの球体が女の子の頭に触れたか）
                const girlHeadPos = new THREE.Vector3(girlModel.position.x, 1.35, girlModel.position.z);
                const c1Pos = new THREE.Vector3();
                const c2Pos = new THREE.Vector3();
                controller1.getWorldPosition(c1Pos);
                controller2.getWorldPosition(c2Pos);

                if (c1Pos.distanceTo(girlHeadPos) < 0.22 || c2Pos.distanceTo(girlHeadPos) < 0.22) {
                    subtitles.innerText = "女の子：『んぅ…なでなでするの気持ちいい……もっとやって？♪』";
                    if (xrSession) {
                        for (const inputSource of xrSession.inputSources) {
                            if (inputSource.gamepad && inputSource.gamepad.hapticActuators && inputSource.gamepad.hapticActuators[0]) {
                                inputSource.gamepad.hapticActuators[0].pulse(0.15, 40); // 触ったときにぶるぶる
                            }
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
